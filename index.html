<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый дашборд</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{
            --bg:#1d5363; --bg2:#143a47; --panel:rgba(255,255,255,0.05); --border:#2a6b7a;
            --text:#ffffff; --text-secondary:#B0D4E0; --gold:#F9A825; --teal:#26C6DA;
            --teal-hover:#00ACC1; --red:#EF5350;
        }
        *{box-sizing:border-box;}
        body{ margin:0; font-family:'Inter',sans-serif; background:linear-gradient(160deg,var(--bg) 0%, var(--bg2) 100%); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        #app{width:100%;}
        .login-page{display:flex;align-items:center;justify-content:center;padding:24px; width:100%;}
        .login-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:40px 32px;text-align:center;backdrop-filter:blur(6px);}
        .login-logo{font-size:32px;color:var(--teal);margin-bottom:12px;}
        .login-box h1{font-size:22px;margin:0 0 6px;font-weight:700;}
        .login-sub{color:var(--text-secondary);font-size:14px;margin:0 0 28px;line-height:1.5;}
        .login-box form{display:flex;flex-direction:column;gap:6px;text-align:left;}
        .login-box label{font-size:13px;color:var(--text-secondary);margin-top:10px;}
        .login-box input{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
        .login-box input:focus{border-color:var(--teal);}
        .login-error{display:none;color:var(--red);font-size:13px;margin-top:8px;word-break:break-word;}
        .btn{background:var(--teal);color:#08303a;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;padding:10px 16px;cursor:pointer;width:100%;margin-top:20px;transition:background .2s;}
        .btn:hover{background:var(--teal-hover);}
        .app-header{display:flex;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);}
        .role-badge{font-size:13px;color:var(--text-secondary);background:rgba(255,255,255,0.06);border:1px solid var(--border);padding:6px 12px;border-radius:20px;}
        .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;width:auto;margin:0;}
        .btn-ghost:hover{background:rgba(255,255,255,0.08);}
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        (function() {
            const SUPABASE_URL = 'https://rytseubhyqcflfavswxj.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_EZo58WdexigTVa0JUFfwjw_-6tae58Y';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let session = null;

            async function doLogin(e) {
                e.preventDefault();
                const u = document.getElementById('loginUser').value.trim();
                const p = document.getElementById('loginPass').value;
                const errorDiv = document.getElementById('loginError');
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';

                try {
                    let email = u;
                    if (!email.includes('@')) email = u + '@test.ru';

                    // Шаг 1: Вход
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password: p });
                    if (error) throw error;

                    const userId = data.user.id;

                    // Шаг 2: Проверить, есть ли профиль
                    let { data: profile, error: profileError } = await supabase
                        .from('profiles')
                        .select('role')
                        .eq('id', userId)
                        .maybeSingle(); // используем maybeSingle вместо single

                    // Если профиль не найден, создаём его с ролью 'user'
                    if (!profile && !profileError) {
                        const { data: newProfile, error: insertError } = await supabase
                            .from('profiles')
                            .insert([{ id: userId, role: 'user' }])
                            .select('role')
                            .maybeSingle();
                        if (insertError) throw insertError;
                        profile = newProfile;
                    } else if (profileError) {
                        throw profileError;
                    }

                    // Шаг 3: Сохраняем сессию и роль
                    session = { user: data.user, role: profile.role };
                    localStorage.setItem('supabaseSession', JSON.stringify(data.session));
                    renderApp();
                } catch (err) {
                    console.error('Ошибка входа:', err);
                    errorDiv.textContent = 'Ошибка: ' + (err.message || 'Неверные учётные данные');
                    errorDiv.style.display = 'block';
                }
            }

            async function logout() {
                await supabase.auth.signOut();
                session = null;
                localStorage.removeItem('supabaseSession');
                renderApp();
            }

            function renderLogin() {
                return `
                <div class="login-page">
                  <div class="login-box">
                    <div class="login-logo"><i class="fa-solid fa-chart-line"></i></div>
                    <h1>Финансовый дашборд</h1>
                    <p class="login-sub">Войдите, чтобы увидеть показатели</p>
                    <form onsubmit="doLogin(event)">
                      <label>Логин (введите <b>user</b> или <b>admin</b>, или полный email)</label>
                      <input type="text" id="loginUser" required autocomplete="username" placeholder="user, admin или user@test.ru" />
                      <label>Пароль</label>
                      <input type="password" id="loginPass" required autocomplete="current-password" placeholder="Vadim02052026 или Anton02052026" />
                      <div class="login-error" id="loginError"></div>
                      <button type="submit" class="btn">Войти</button>
                    </form>
                  </div>
                </div>`;
            }

            function renderDashboard() {
                return `
                <div class="app-header">
                  <div><i class="fa-solid fa-chart-line" style="color:#26C6DA"></i> Финансовый дашборд</div>
                  <div>
                    <span class="role-badge">${session.role === 'admin' ? 'Администратор' : 'Пользователь'}</span>
                    <button class="btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
                  </div>
                </div>
                <div style="padding:40px; text-align:center; max-width:600px; margin:0 auto;">
                  <h2>Добро пожаловать, ${session.role === 'admin' ? 'администратор' : 'пользователь'}!</h2>
                  <p style="color:var(--text-secondary);">Вы успешно вошли в систему. Загружаем данные...</p>
                  <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color:var(--teal); margin-top:20px;"></i>
                </div>`;
            }

            function renderApp() {
                const app = document.getElementById('app');
                if (!session) {
                    app.innerHTML = renderLogin();
                } else {
                    app.innerHTML = renderDashboard();
                }
            }

            async function checkSession() {
                try {
                    const stored = localStorage.getItem('supabaseSession');
                    if (stored) {
                        const sess = JSON.parse(stored);
                        const { data: { session: current } } = await supabase.auth.getSession();
                        if (current) {
                            const { data: profile } = await supabase
                                .from('profiles')
                                .select('role')
                                .eq('id', current.user.id)
                                .maybeSingle();
                            if (profile) {
                                session = { user: current.user, role: profile.role };
                                renderApp();
                                return;
                            }
                        }
                    }
                    renderApp();
                } catch (e) {
                    console.error('Ошибка при проверке сессии:', e);
                    renderApp();
                }
            }

            window.doLogin = doLogin;
            window.logout = logout;
            checkSession();
        })();
    </script>
</body>
</html>
