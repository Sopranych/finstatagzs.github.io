    <style>
        :root{
            --bg:#1d5363; --bg2:#143a47; --panel:rgba(255,255,255,0.05); --border:#2a6b7a;
            --text:#ffffff; --text-secondary:#B0D4E0; --gold:#F9A825; --teal:#26C6DA;

        .login-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:40px 32px;text-align:center;backdrop-filter:blur(6px);}

        .login-sub{color:var(--text-secondary);font-size:14px;margin:0 0 28px;line-height:1.5;}

        .login-box input{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}

        .entry-selects{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
        .field{display:flex;flex-direction:column;gap:6px;}
        .field label{font-size:12px;color:var(--text-secondary);font-weight:600;}
        .bulk-fill{display:flex;gap:10px;margin-bottom:14px;}
        .single-entry{display:flex;gap:10px;}
        .bulk-input{width:120px;}
        .msg-banner{position:fixed;top:20px;right:20px;display:none;align-items:center;gap:8px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
        .msg-banner.error{background:#3a1414;color:var(--red);border:1px solid rgba(239,83,80,0.4);}
        .msg-banner.success{background:#0f3a2e;color:#66BB6A;border:1px solid rgba(102,187,106,0.4);}
        .sync-badge{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.05);cursor:pointer;transition:background .2s;color:var(--text-secondary);}
        .sync-badge:hover{background:rgba(255,255,255,0.1);}
        .sync-panel{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
        .sync-panel-inner{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:420px;width:100%;}
        .sync-panel-inner h3{margin:0 0 10px;font-size:17px;color:var(--text);}
        .sync-panel-inner p{color:var(--text-secondary);font-size:13px;line-height:1.5;margin:0 0 16px;}
        .sync-panel-inner label{font-size:12px;color:var(--text-secondary);font-weight:600;display:block;margin-bottom:6px;}
        .sync-row{display:flex;gap:8px;}
        .sync-row .text-input{flex:1;}
        .sync-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
        @media (max-width:900px){ .layout{grid-template-columns:1fr;} .filters-panel{position:static;} }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. Инициализация клиента (подставьте свои данные из Шага 4)
    const supabaseUrl = https://fomgmsuuwahfjqimekkv.supabase.co/rest/v1/;
    const supabaseKey = sb_publishable_V-oDfCqaUgI8a1b4PsHD4g_onYACyHE;
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // --- Функция ЗАГРУЗКИ данных (показывает всем пользователям) ---
    async function loadReports() {
        const { data, error } = await supabase
            .from('reports')
            .select('*')
            .order('created_at', { ascending: false }); // Сначала новые

        if (error) {
            console.error('Ошибка загрузки:', error);
            return;
        }

        // Отображаем данные в вашем HTML (пример для DIV с id="reportList")
        const list = document.getElementById('reportList');
        if (list) {
            list.innerHTML = data.map(row => 
                `<p>${row.indicator_name}: ${row.indicator_value} (добавлено: ${new Date(row.created_at).toLocaleString()})</p>`
            ).join('');
        }
    }

    // --- Функция СОХРАНЕНИЯ данных (отправляет в общую БД) ---
    async function saveReport(indicatorName, indicatorValue) {
        // Сюда можно добавить проверку на пустые значения
        if (!indicatorName || !indicatorValue) {
            alert('Заполните все поля!');
            return;
        }

        // Получаем IP пользователя (через бесплатный сервис, чтобы видеть, кто вносил)
        let userIp = 'unknown';
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const ipData = await res.json();
            userIp = ipData.ip;
        } catch(e) {}

        const { data, error } = await supabase
            .from('reports')
            .insert([
                { 
                    indicator_name: indicatorName, 
                    indicator_value: parseFloat(indicatorValue),
                    user_ip: userIp 
                }
            ])
            .select();

        if (error) {
            alert('Ошибка сохранения: ' + error.message);
        } else {
            alert('Показатель успешно сохранен!');
            loadReports(); // Обновляем список на странице
            // Очищаем поля формы
            document.getElementById('nameInput').value = '';
            document.getElementById('valueInput').value = '';
        }
    }

    // --- Привязка кнопки к функции ---
    // Вызываем эту функцию при загрузке страницы, чтобы сразу показать данные
    document.addEventListener('DOMContentLoaded', () => {
        loadReports();

        // Находим кнопку отправки (допустим, у нее id="submitBtn")
        const btn = document.getElementById('submitBtn');
        if (btn) {
            btn.addEventListener('click', () => {
                const name = document.getElementById('nameInput').value;
                const value = document.getElementById('valueInput').value;
                saveReport(name, value);
            });
        }
    });
</script>

<body>
    <div id="app"></div>
    <script>
        const STORAGE_KEYS = {objects:'fd_objects', periods:'fd_periods', indicators:'fd_indicators', data:'fd_data', session:'fd_session'};
        let objects=[], periods=[], indicators=[], data=[], session=null;
        let filters = {objectIds:[], periodType:'month', periodIds:[], showDetail:false};
        let tempObjectIds=[], tempPeriodIds=[], tempPeriodType='month';
        let chartIndicatorId=null, adminTab='dashboard', newPeriodType='month';
        let editingObjectId=null, editingIndicatorId=null;
        let entryState = {objectId:'all', periodId:null, indicatorId:null};
        const KVDB_BASE = 'https://kvdb.io';
        const SYNC_BUCKET = 'findash-global-shared-storage-9f2a1c7e';
        let syncStatus = 'idle';
        let syncPollTimer = null;
        let lastRemoteUpdatedAt = 0;
        let pushDebounceTimer = null;

        function uid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;const v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
        function escapeHtml(str){return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}

        function loadAll(){
            objects = JSON.parse(localStorage.getItem(STORAGE_KEYS.objects)||'null');
            periods = JSON.parse(localStorage.getItem(STORAGE_KEYS.periods)||'null');
            indicators = JSON.parse(localStorage.getItem(STORAGE_KEYS.indicators)||'null');
            data = JSON.parse(localStorage.getItem(STORAGE_KEYS.data)||'null');
            session = JSON.parse(localStorage.getItem(STORAGE_KEYS.session)||'null');
            if(!objects || !periods || !indicators || !data){ seed(); }
        }
        function persist(key){
            const map={objects,periods,indicators,data};
            localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(map[key]));
            schedulePush();
        }
        async function initSync(){
            updateSyncStatus('syncing');
            await pullRemote(true);
            if(session){ sanitizeFiltersAfterSync(); renderApp(); }
            startPolling();
        }
        function startPolling(){
            clearTimeout(syncPollTimer);
            scheduleNextPoll();
        }
        function scheduleNextPoll(){
            clearTimeout(syncPollTimer);
            const delay = syncStatus==='error' ? 4000 : 9000;
            syncPollTimer = setTimeout(async ()=>{ await pullRemote(false); scheduleNextPoll(); }, delay);
        }
        async function pullRemote(initial){
            try{
                const res = await fetch(KVDB_BASE+'/'+SYNC_BUCKET+'/appstate', {cache:'no-store'});
                if(res.status===404){
                    updateSyncStatus('ok');
                    await pushRemote(true);
                    return;
                }
                if(!res.ok) throw new Error('pull failed');
                const text = await res.text();
                let remote = null;
                try{ remote = JSON.parse(text); } catch(parseErr){ remote = null; }
                if(remote && typeof remote.updatedAt==='number' && remote.updatedAt>lastRemoteUpdatedAt){
                    lastRemoteUpdatedAt = remote.updatedAt;
                    objects = remote.objects || objects;
                    periods = remote.periods || periods;
                    indicators = remote.indicators || indicators;
                    data = remote.data || data;
                    localStorage.setItem(STORAGE_KEYS.objects, JSON.stringify(objects));
                    localStorage.setItem(STORAGE_KEYS.periods, JSON.stringify(periods));
                    localStorage.setItem(STORAGE_KEYS.indicators, JSON.stringify(indicators));
                    localStorage.setItem(STORAGE_KEYS.data, JSON.stringify(data));
                    if(!initial){ sanitizeFiltersAfterSync(); if(session) renderApp(); }
                }
                updateSyncStatus('ok');
            } catch(e){ updateSyncStatus('error'); }
        }
        function sanitizeFiltersAfterSync(){
            filters.objectIds = filters.objectIds.filter(id=>objects.some(o=>o.id===id));
            filters.periodIds = filters.periodIds.filter(id=>periods.some(p=>p.id===id));
            if(filters.objectIds.length===0 || filters.periodIds.length===0){ initFiltersDefault(); }
        }
        function schedulePush(){
            clearTimeout(pushDebounceTimer);
            pushDebounceTimer = setTimeout(()=>{ pushRemote(false); }, 700);
        }
        async function pushRemote(){
            updateSyncStatus('syncing');
            const payload = JSON.stringify({objects, periods, indicators, data, updatedAt: Date.now()});
            try{
                const res = await fetch(KVDB_BASE+'/'+SYNC_BUCKET+'/appstate', {method:'PUT', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body: payload});
                if(!res.ok) throw new Error('push failed');
                lastRemoteUpdatedAt = JSON.parse(payload).updatedAt;
                updateSyncStatus('ok');
            } catch(e){ updateSyncStatus('error'); }
        }
        function updateSyncStatus(status){
            syncStatus = status;
            const icon = document.getElementById('syncIcon');
            const text = document.getElementById('syncStatusText');
            const panel = document.getElementById('syncPanel');
            if(panel && panel.style.display==='flex'){ panel.innerHTML = renderSyncPanelInner(); }
            if(!icon||!text) return;
            const map = {
                idle:{i:'fa-cloud',c:'#B0D4E0',t:'Синхронизация'},
                syncing:{i:'fa-arrows-rotate fa-spin',c:'#26C6DA',t:'Синхронизация...'},
                ok:{i:'fa-cloud-arrow-up',c:'#66BB6A',t:'Данные синхронизированы'},
                error:{i:'fa-triangle-exclamation',c:'#EF5350',t:'Нет связи с сервером'}
            };
            const m = map[status]||map.idle;
            icon.className = 'fa-solid '+m.i;
            icon.style.color = m.c;
            text.textContent = m.t;
            text.style.color = m.c;
        }
        function openSyncPanel(){
            let el = document.getElementById('syncPanel');
            if(!el){ el=document.createElement('div'); el.id='syncPanel'; el.className='sync-panel'; el.onclick=function(e){ if(e.target===el) closeSyncPanel(); }; document.body.appendChild(el); }
            el.innerHTML = renderSyncPanelInner();
            el.style.display='flex';
        }
        function closeSyncPanel(){
            const el = document.getElementById('syncPanel');
            if(el) el.style.display='none';
        }
        function renderSyncPanelInner(){
            const map = {
                idle:{t:'Ожидание подключения', c:'#B0D4E0', icon:'fa-cloud'},
                syncing:{t:'Синхронизация...', c:'#26C6DA', icon:'fa-arrows-rotate fa-spin'},
                ok:{t:'Данные синхронизированы', c:'#66BB6A', icon:'fa-cloud-arrow-up'},
                error:{t:'Нет связи с сервером синхронизации', c:'#EF5350', icon:'fa-triangle-exclamation'}
            };
            const m = map[syncStatus]||map.idle;
            return `<div class="sync-panel-inner" onclick="event.stopPropagation()">
              <h3><i class="fa-solid ${m.icon}" style="color:${m.c}"></i> Синхронизация данных</h3>
              <p>Статус: <b style="color:${m.c}">${m.t}</b><br>Все изменения автоматически сохраняются на сервере и подгружаются на других устройствах каждые несколько секунд. Если статус «Нет связи с сервером», проверьте интернет-соединение и нажмите «Повторить сейчас».</p>
              <div class="sync-actions">
                <button class="btn btn-primary btn-sm" onclick="forceSyncNow()"><i class="fa-solid fa-arrows-rotate"></i> Повторить сейчас</button>
                <button class="btn btn-ghost btn-sm" onclick="closeSyncPanel()"><i class="fa-solid fa-xmark"></i> Закрыть</button>
              </div>
            </div>`;
        }
        async function forceSyncNow(){
            updateSyncStatus('syncing');
            await pullRemote(false);
            await pushRemote(true);
        }

        function seed(){
            objects=[];
            for(let i=1;i<=18;i++) objects.push({id:uid(), name:'Объект '+i});
            periods=[];
            const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            const today=new Date();
            for(let i=2;i>=0;i--){
                let d=new Date(today.getFullYear(), today.getMonth()-i, 1);
                let iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
                periods.push({id:uid(), type:'month', date:iso, label:monthNames[d.getMonth()]+' '+d.getFullYear()});
            }
            for(let i=6;i>=0;i--){
                let d=new Date(today); d.setDate(today.getDate()-i);
                let iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

                periods.push({id:uid(), type:'day', date:iso, label:label});

            ];

                periods.forEach(p=>{
                    const buy = +(40+Math.random()*15).toFixed(2);
                    const sell = +(buy + 5 + Math.random()*10).toFixed(2);
                    const margin = +(sell-buy).toFixed(2);
                    const profit = Math.round(500000 + Math.random()*2500000);
                    data.push({id:uid(), object_id:o.id, period_id:p.id, indicator_id:indicators[0].id, value:profit});
                    data.push({id:uid(), object_id:o.id, period_id:p.id, indicator_id:indicators[1].id, value:buy});
                    data.push({id:uid(), object_id:o.id, period_id:p.id, indicator_id:indicators[2].id, value:sell});

            });

        function computeIndicatorPeriodAvg(periodId, indicatorId, objectIds){
            const vals=[];
            objectIds.forEach(oid=>{
                const d = data.find(d=>d.object_id===oid && d.period_id===periodId && d.indicator_id===indicatorId);
                if(d && d.value!==null && d.value!==undefined) vals.push(d.value);
            });
            if(vals.length===0) return null;
            return vals.reduce((a,b)=>a+b,0)/vals.length;
        }
        function computeKPI(indicatorId){
            const vals = filters.periodIds.map(pid=>computeIndicatorPeriodAvg(pid, indicatorId, filters.objectIds)).filter(v=>v!==null);
            if(vals.length===0) return null;
            return vals.reduce((a,b)=>a+b,0)/vals.length;
        }
        function formatValue(value, unit){
            if(value===null || value===undefined) return '—';
            if(unit==='руб.') return Math.round(value).toLocaleString('ru-RU')+' '+unit;
            return value.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+unit;
        }
        function renderKPIHTML(){
            if(indicators.length===0) return `<div class="empty-hint">Нет показателей</div>`;

                return `<div class="kpi-card"><div class="kpi-icon" style="color:${colors[i%colors.length]}"><i class="fa-solid fa-chart-simple"></i></div><div class="kpi-label">${escapeHtml(ind.name)}</div><div class="kpi-value">${formatValue(val, ind.unit)}</div></div>`;

        }

            let header1 = `<th class="sticky-col">Объект</th>`;

                selPeriods.forEach(p=>{ indicators.forEach(ind=>{
                    const v = computeIndicatorPeriodAvg(p.id, ind.id, filters.objectIds);

                    filters.objectIds.forEach(oid=>{
                        const obj = objects.find(o=>o.id===oid);

                        selPeriods.forEach(p=>{ indicators.forEach(ind=>{
                            const d = data.find(d=>d.object_id===oid&&d.period_id===p.id&&d.indicator_id===ind.id);
                            bodyRows += `<td>${d?formatValue(d.value, ind.unit):'—'}</td>`;
                        }); });
                        bodyRows += `</tr>`;
                    });
                }
            }
            return `<div class="table-card">
              <div class="table-card-head"><div class="table-title"><i class="fa-solid fa-table"></i> Таблица данных</div>
              ${multi?`<label class="detail-toggle"><input type="checkbox" ${filters.showDetail?'checked':''} onchange="toggleShowDetail()"/> Показать по каждому объекту</label>`:''}</div>
              <div class="table-scroll"><table class="data-table"><thead><tr>${header1}</tr><tr>${header2}</tr></thead><tbody>${bodyRows}</tbody></table></div>
            </div>`;
        }
        function toggleShowDetail(){ filters.showDetail=!filters.showDetail; document.getElementById('tableContainer').innerHTML = renderTableHTML(); }
        function renderChartHTML(){
            const selPeriods = periods.filter(p=>filters.periodIds.includes(p.id)).sort((a,b)=>a.date.localeCompare(b.date));
            const options = indicators.map(ind=>`<option value="${ind.id}" ${chartIndicatorId===ind.id?'selected':''}>${escapeHtml(ind.name)}</option>`).join('');
            let svg='';
            if(selPeriods.length<1 || !chartIndicatorId){ svg = `<div class="empty-hint">Недостаточно данных для графика</div>`; }
            else {
                const points = selPeriods.map(p=>({label:p.label, value: computeIndicatorPeriodAvg(p.id, chartIndicatorId, filters.objectIds)}));
                const known = points.filter(pt=>pt.value!==null);
                if(known.length===0){ svg = `<div class="empty-hint">Нет данных</div>`; }
                else {
                    const w=Math.max(600, points.length*90), h=260, padL=60, padR=20, padT=20, padB=40;
                    const maxV = Math.max(...known.map(p=>p.value));
                    const minV = Math.min(0, Math.min(...known.map(p=>p.value)));
                    const scaleX = (i)=> padL + i*((w-padL-padR)/Math.max(1,points.length-1));
                    const scaleY = (v)=> h-padB - ((v-minV)/((maxV-minV)||1))*(h-padT-padB);
                    let path='', circles='';
                    points.forEach((pt,i)=>{
                        if(pt.value===null) return;
                        const x=scaleX(i), y=scaleY(pt.value);
                        path += (path===''?'M':'L')+x+','+y+' ';
                        circles += `<circle cx="${x}" cy="${y}" r="4" fill="#26C6DA" /><text x="${x}" y="${y-12}" fill="#FFFFFF" font-size="11" text-anchor="middle">${formatValue(pt.value,'').trim()}</text>`;
                    });
                    let gridLines='';
                    for(let i=0;i<=4;i++){ const y = padT + i*((h-padT-padB)/4); gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`; }
                    let xLabels='';
                    points.forEach((pt,i)=>{ xLabels += `<text x="${scaleX(i)}" y="${h-14}" fill="#B0D4E0" font-size="11" text-anchor="middle">${escapeHtml(pt.label)}</text>`; });
                    svg = `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">${gridLines}<path d="${path}" fill="none" stroke="#26C6DA" stroke-width="2.5"/>${circles}${xLabels}</svg>`;
                }
            }
            return `<div class="chart-card"><div class="table-card-head"><div class="table-title"><i class="fa-solid fa-chart-line"></i> Динамика показателя</div><select class="select-input" onchange="changeChartIndicator(this.value)">${options}</select></div><div class="chart-scroll">${svg}</div></div>`;
        }

        function addPeriod(){
            const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            if(newPeriodType==='day'){
                const val = document.getElementById('newPeriodDate').value;
                if(!val){ showMessage('error','Укажите дату'); return; }
                if(periods.some(p=>p.type==='day'&&p.date===val)){ showMessage('error','Такой период уже есть'); return; }
                const d = new Date(val+'T00:00:00');
                const label = String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
                periods.push({id:uid(), type:'day', date:val, label});
            } else {
                const val = document.getElementById('newPeriodMonth').value;
                if(!val){ showMessage('error','Укажите месяц'); return; }
                const iso = val+'-01';
                if(periods.some(p=>p.type==='month'&&p.date===iso)){ showMessage('error','Такой период уже есть'); return; }
                const parts = val.split('-').map(Number);
                const label = monthNames[parts[1]-1]+' '+parts[0];
                periods.push({id:uid(), type:'month', date:iso, label});
            }
            persist('periods'); renderApp(); showMessage('success','Период добавлен');
        }

                :
                `<span class="admin-list-name">${escapeHtml(ind.name)} <span class="tag">${escapeHtml(ind.unit)}</span></span><button class="btn btn-ghost btn-sm" onclick="editingIndicatorId='${ind.id}';renderApp();"><i class="fa-solid fa-pen"></i></button><button class="btn btn-danger btn-sm" onclick="deleteIndicator('${ind.id}')"><i class="fa-solid fa-trash"></i></button>`
              }</div>`).join('')}</div>
            <div class="admin-add-form"><input type="text" id="newIndicatorName" class="text-input" placeholder="Название показателя" /><input type="text" id="newIndicatorUnit" class="text-input small" placeholder="Ед. изм." /><button class="btn btn-primary" onclick="addIndicator()"><i class="fa-solid fa-plus"></i> Добавить показатель</button></div></div>`;
        }
        function addIndicator(){
            const name = document.getElementById('newIndicatorName').value.trim();
            const unit = document.getElementById('newIndicatorUnit').value.trim() || '—';
            if(!name){ showMessage('error','Введите название показателя'); return; }
            indicators.push({id:uid(), name, unit}); persist('indicators'); renderApp(); showMessage('success','Показатель добавлен');
        }
        function saveIndicatorEdit(id){
            const name = document.getElementById('editIndName').value.trim();
            const unit = document.getElementById('editIndUnit').value.trim();
            if(!name){ showMessage('error','Название не может быть пустым'); return; }
            const ind = indicators.find(i=>i.id===id); if(ind){ ind.name=name; ind.unit=unit||'—'; }
            persist('indicators'); editingIndicatorId=null; renderApp(); showMessage('success','Изменения сохранены');
        }
        function deleteIndicator(id){
            if(indicatorHasData(id)){ showMessage('error','Нельзя удалить: есть связанные данные'); return; }
            indicators = indicators.filter(i=>i.id!==id); persist('indicators'); renderApp(); showMessage('success','Показатель удалён');
        }
        function valueForCell(objectId){
            const d = data.find(d=>d.object_id===objectId && d.period_id===entryState.periodId && d.indicator_id===entryState.indicatorId);
            return d ? d.value : null;
        }
        function setValue(objectId, periodId, indicatorId, value){
            let d = data.find(d=>d.object_id===objectId && d.period_id===periodId && d.indicator_id===indicatorId);
            if(d) d.value = value; else data.push({id:uid(), object_id:objectId, period_id:periodId, indicator_id:indicatorId, value});
        }
        function renderEntryHTML(){
            const sortedPeriods = [...periods].sort((a,b)=>a.date.localeCompare(b.date));
            const objOptions = `<option value="all">Все объекты</option>` + objects.map(o=>`<option value="${o.id}" ${entryState.objectId===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('');
            const periodOptions = sortedPeriods.map(p=>`<option value="${p.id}" ${entryState.periodId===p.id?'selected':''}>${escapeHtml(p.label)} (${p.type==='day'?'День':'Месяц'})</option>`).join('');
            const indOptions = indicators.map(ind=>`<option value="${ind.id}" ${entryState.indicatorId===ind.id?'selected':''}>${escapeHtml(ind.name)}</option>`).join('');
            let bottom='';
            if(entryState.objectId==='all'){
                bottom = `<div class="bulk-fill"><input type="number" step="any" id="bulkFillValue" class="text-input" placeholder="Значение для всех" /><button class="btn btn-ghost" onclick="fillAllEntries()"><i class="fa-solid fa-arrows-to-dot"></i> Заполнить все</button></div>
                <div class="admin-list">${objects.map(o=>{
                    const existing = entryState.periodId && entryState.indicatorId ? valueForCell(o.id) : null;
                    return `<div class="admin-list-row"><span class="admin-list-name">${escapeHtml(o.name)}</span><input type="number" step="any" class="text-input small bulk-input" data-oid="${o.id}" value="${existing!==null&&existing!==undefined?existing:''}" placeholder="—" /></div>`;
                }).join('')}</div>
                <button class="btn btn-primary btn-block" onclick="saveAllEntries()"><i class="fa-solid fa-floppy-disk"></i> Сохранить все</button>`;
            } else {
                const existing = entryState.periodId && entryState.indicatorId ? valueForCell(entryState.objectId) : null;
                bottom = `<div class="single-entry"><input type="number" step="any" id="singleEntryValue" class="text-input" value="${existing!==null&&existing!==undefined?existing:''}" placeholder="Значение" /><button class="btn btn-primary" onclick="saveSingleEntry()"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button></div>`;
            }
            return `<div class="admin-card"><div class="admin-card-title"><i class="fa-solid fa-keyboard"></i> Ввод данных</div>
            <div class="entry-selects">
              <div class="field"><label>Объект</label><select class="select-input" onchange="entryState.objectId=this.value;renderApp();">${objOptions}</select></div>
              <div class="field"><label>Период</label><select class="select-input" onchange="entryState.periodId=this.value;renderApp();">${periodOptions}</select></div>
              <div class="field"><label>Показатель</label><select class="select-input" onchange="entryState.indicatorId=this.value;renderApp();">${indOptions}</select></div>
            </div>${bottom}</div>`;
        }
        function saveSingleEntry(){
            if(!entryState.periodId || !entryState.indicatorId){ showMessage('error','Выберите период и показатель'); return; }
            const val = parseFloat(document.getElementById('singleEntryValue').value);
            if(isNaN(val)){ showMessage('error','Введите числовое значение'); return; }
            setValue(entryState.objectId, entryState.periodId, entryState.indicatorId, val);
            persist('data'); showMessage('success','Значение сохранено'); renderApp();
        }
        function fillAllEntries(){
            const v = document.getElementById('bulkFillValue').value;
            document.querySelectorAll('.bulk-input').forEach(inp=>{ inp.value = v; });
        }
        function saveAllEntries(){
            if(!entryState.periodId || !entryState.indicatorId){ showMessage('error','Выберите период и показатель'); return; }
            const inputs = document.querySelectorAll('.bulk-input');
            let count=0;
            inputs.forEach(inp=>{
                const oid = inp.getAttribute('data-oid');
                const v = inp.value;
                if(v!==''){ const num = parseFloat(v); if(!isNaN(num)){ setValue(oid, entryState.periodId, entryState.indicatorId, num); count++; } }
            });
            persist('data'); showMessage('success','Сохранено значений: '+count); renderApp();
        }

        function renderApp(){
            const app = document.getElementById('app');
            if(!session){ app.innerHTML = renderLoginHTML(); return; }
            let html = renderHeaderHTML();
            if(session.role==='admin') html += renderNavHTML();
            if(session.role==='admin' && adminTab!=='dashboard'){
                html += `<div class="page-wrap">${renderAdminTab(adminTab)}</div>`;
            } else {
                html += `<div class="layout"><div class="filters-panel">${renderFiltersPanelHTML()}</div><div class="main-content">${renderDashboardMainHTML()}</div></div>`;
            }
            app.innerHTML = html;
            // force reflow to fix stale render on some mobile browsers after dynamic innerHTML updates
            void app.offsetHeight;
            if(session) updateSyncStatus(syncStatus);
        }

        loadAll();
        initFiltersDefault();
        renderApp();
        initSync();
    </script>
</body>
</html>
